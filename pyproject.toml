[project]
name = "kivi-memory"
version = "0.1.0"
description = "Kivi word-level phonetic memory lab"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jellyfish>=1.1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
kivi = "kivi_memory.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kivi_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
